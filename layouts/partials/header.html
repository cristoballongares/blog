<header class="header">
    <nav class="nav">
        <div class="logo">
            {{- $label_text := (site.Params.label.text | default site.Title) }}
            <a href="{{ "" | absLangURL }}" accesskey="h" title="{{ $label_text }} (Alt + H)">
                {{- $label_text -}}
            </a>
            <div class="logo-switches">
                <!-- Theme Toggles -->
                <button id="japanese-toggle" title="Tema Japonés Vintage" aria-label="Tema Japonés Vintage">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="16"></line>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                </button>

                <button id="obsidian-toggle" title="Tema Obsidian" aria-label="Tema Obsidian">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3l1.912 5.886h6.188l-5 3.633 1.912 5.886-5-3.633-5 3.633 1.912-5.886-5-3.633h6.188z"></path>
                    </svg>
                </button>

                {{- if (not site.Params.disableThemeToggle) }}
                <button id="theme-toggle" accesskey="t" title="(Alt + T)">
                    <svg id="moon" xmlns="http://www.w3.org/2000/svg" width="24" height="18" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    <svg id="sun" xmlns="http://www.w3.org/2000/svg" width="24" height="18" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
                {{- end }}
            </div>
        </div>
        <ul id="menu">
            {{- range site.Menus.main }}
            <li>
                <a href="{{ .URL | absLangURL }}" title="{{ .Title | default .Name }}">
                    <span>{{ .Name }}</span>
                </a>
            </li>
            {{- end }}
        </ul>
    </nav>
</header>

<script>
    const setMode = (mode) => {
        document.body.classList.remove("theme-obsidian", "theme-japanese");
        document.documentElement.classList.remove("obsidian-active", "japanese-active");
        
        if (mode) {
            document.body.classList.add("theme-" + mode);
            document.documentElement.classList.add(mode + "-active");
            localStorage.setItem("blog-mode", mode);
        } else {
            localStorage.removeItem("blog-mode");
        }
    };

    document.getElementById("japanese-toggle").addEventListener("click", () => {
        if (document.body.classList.contains("theme-japanese")) {
            setMode(null);
        } else {
            setMode("japanese");
        }
    });

    document.getElementById("obsidian-toggle").addEventListener("click", () => {
        if (document.body.classList.contains("theme-obsidian")) {
            setMode(null);
        } else {
            setMode("obsidian");
        }
    });
</script>
