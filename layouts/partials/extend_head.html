<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        renderMathInElement(document.body, {
            delimiters: [
                {left: "$$", right: "$$", display: true},
                {left: "\\[", right: "\\]", display: true},
                {left: "$", right: "$", display: false},
                {left: "\\(", right: "\\)", display: false}
            ]
        });
    });
</script>

<!-- Obsidian Theme Support -->
<link rel="stylesheet" href="/css/theme-obsidian.css">
<script>
    (function() {
        const storedTheme = localStorage.getItem('obsidian-mode');
        if (storedTheme === 'enabled' || (!storedTheme && {{ site.Params.defaultToObsidian | default false }})) {
            document.documentElement.classList.add('obsidian-active');
            // We'll apply the class to body in a DOMContentLoaded listener since body isn't available yet
            document.addEventListener("DOMContentLoaded", function() {
                document.body.classList.add('theme-obsidian');
            });
        }
    })();
</script>
