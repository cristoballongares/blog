<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        renderMathInElement(document.body, {
            delimiters: [
                {left: "$$", right: "$$", display: true},
                {left: "\\[", right: "\\]", display: true},
                {left: "$", right: "$", display: false},
                {left: "\\(", right: "\\)", display: false}
            ]
        });
    });
</script>

<!-- Google Fonts for Vintage Japanese Theme -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<!-- Themes Support -->
<link rel="stylesheet" href="/css/theme-obsidian.css">
<link rel="stylesheet" href="/css/theme-japanese.css">
<script>
    (function() {
        const storedTheme = localStorage.getItem('blog-mode');
        if (storedTheme === 'japanese') {
            document.documentElement.classList.add('japanese-active');
            document.addEventListener("DOMContentLoaded", function() {
                document.body.classList.add('theme-japanese');
            });
        } else if (storedTheme === 'obsidian' || (!storedTheme && {{ site.Params.defaultToObsidian | default false }})) {
            document.documentElement.classList.add('obsidian-active');
            document.addEventListener("DOMContentLoaded", function() {
                document.body.classList.add('theme-obsidian');
            });
        }
    })();
</script>
