<!DOCTYPE html>
<html lang="{{ site.Language }}" dir="{{ .Language.LanguageDirection | default "auto" }}">

<head>
    {{- partial "head.html" . }}
</head>

<body id="top">
    {{ partial "header.html" . -}}

    <div class="site-container">
        {{- if not .IsHome }}
        {{- partial "sidebar.html" . }}
        {{- end }}

        <main class="main">
            {{- block "main" . }}{{ end }}
        </main>
    </div>

    {{ partial "footer.html" . -}}
</body>

</html>
