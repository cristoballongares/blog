baseURL: "https://blogdev-black.vercel.app"
languageCode: "es-es"
title: "Mi Diario Dev"
theme: "PaperMod"

params:
  # Color del tema (auto detecta modo oscuro/claro)
  defaultTheme: auto
  # Activar matemáticas (LaTeX)
  math: true
  
  # Configuración de la página de inicio
  homeInfoParams:
    Title: "Hola, soy Dev 👋"
    Content: "Aquí comparto mis soluciones de código y aprendizaje de matemáticas."

  # Redes sociales (opcional, puedes borrarlas si quieres)
  socialIcons:
    - name: github
      url: "https://github.com/"

# Menú de navegación arriba
menu:
  main:
    - identifier: categories
      name: Categorías
      url: /categories/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20


      # Configuración para que Hugo entienda las matemáticas
markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - [ "$$", "$$" ]
            - [ "\\(", "\\)" ]
          inline:
            - [ "$", "$" ]
            - [ "\\(", "\\)" ]
