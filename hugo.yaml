baseURL: "https://blogdev-black.vercel.app/"
languageCode: "es-es"
title: "Blog dev"
theme: "PaperMod"

enableInlineShortcodes: true

# Configuración crítica para que Hugo NO rompa las fórmulas matemáticas
markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - [ "$$", "$$" ]
            - [ "\\(", "\\)" ]
          inline:
            - [ "$", "$" ]
            - [ "\\(", "\\)" ]

params:
  # Color del tema
  defaultTheme: auto
  # ESTO ES IMPORTANTE: Activa el script de matemáticas en el tema
  math: true
  
  homeInfoParams:
    Title: ":)"
    Content: ""

  socialIcons:
    - name: github
      url: "https://github.com/cristoballongares"


menu:
  main:
    - identifier: categories
      name: Categorías
      url: /categories/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20