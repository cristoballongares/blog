baseURL: "https://blogdev-black.vercel.app/"
languageCode: "es-es"
title: "Blog dev"
theme: "PaperMod"

enableInlineShortcodes: true

# Configuración crítica para que Hugo NO rompa las fórmulas matemáticas
markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - [ "$$", "$$" ]
            - [ "\\(", "\\)" ]
          inline:
            - [ "$", "$" ]
            - [ "\\(", "\\)" ]

params:
  author:
    name: "Autor"
  # Color del tema
  defaultTheme: "light"
  disableThemeToggle: true
  # Obsidian theme support
  defaultToObsidian: true
  
  # ESTO ES IMPORTANTE: Activa el script de matemáticas en el tema
  math: true
  
  description: "Explorando la programación competitiva, algoritmos y estructuras de datos."
  
  homeInfoParams:
    Title: "Bienvenido a mi Blog Dev"
    Content: "Aquí comparto mis análisis de problemas de Codeforces, tutoriales de algoritmos y más."

  socialIcons:
    - name: github
      url: "https://github.com/cristoballongares"


menu:
  main:
    - identifier: categories
      name: Categorías
      url: /categories/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20